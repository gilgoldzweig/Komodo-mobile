#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx14g
kotlin.incremental.native=true

#Gradle
org.gradle.jvmargs=-Xmx14g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=3g
